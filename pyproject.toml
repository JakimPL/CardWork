[project]
name = "cardwork"
version = "0.0.1"
description = "A tiny framework for various playing card games"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jakim" }]
license = "MIT"
keywords = ["cards", "deck"]
dependencies = ["pydantic>=2.9,<3"]

[dependency-groups]
dev = [
    "black==26.5.1",
    "import-linter==2.13",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pylint==4.0.6",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardwork"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["cardwork"]

[tool.pylint.main]
extension-pkg-allow-list = ["pydantic"]
load-plugins = ["pylint_pydantic"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-function-args",
    "line-too-long",
]

[tool.importlinter]
root_package = "cardwork"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "cardwork.games",
    "cardwork.boards",
    "cardwork.moves",
    "cardwork.decks",
    "cardwork.cards",
    "cardwork.models",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["cardwork"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
files = ["src/cardwork"]
exclude = ["tests"]
disallow_subclassing_any = true
ignore_missing_imports = true
strict = true
