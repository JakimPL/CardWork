[project]
name = "cardwork"
version = "0.0.1"
description = "A tiny framework for various playing card games"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jakim" }]
license = "MIT"
keywords = ["cards", "deck"]
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = [
    "black==26.5.1",
    "cardwork[server]",
    "httpx==0.28.1",
    "hypothesis==6.165.0",
    "import-linter==2.13",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pylint==4.0.6",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardwork", "src/cardserver", "src/cardgames"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["cardwork", "cardserver", "cardgames"]

[tool.pylint.main]
extension-pkg-allow-list = ["pydantic"]
load-plugins = ["pylint_pydantic"]

[tool.pylint.similarities]
min-similarity-lines = 10

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-function-args",
    "too-many-public-methods",
    "line-too-long",
]

[tool.importlinter]
root_packages = ["cardwork", "cardserver", "cardgames"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "cardwork.presentation",
    "cardwork.rounds",
    "cardwork.games",
    "cardwork.views",
    "cardwork.transactions",
    "cardwork.effects",
    "cardwork.positions",
    "cardwork.boards",
    "cardwork.states",
    "cardwork.moves",
    "cardwork.zones",
    "cardwork.decks",
    "cardwork.combinations",
    "cardwork.cards",
    "cardwork.ordering",
    "cardwork.models",
]

[[tool.importlinter.contracts]]
name = "Adapter layers"
type = "layers"
layers = [
    "cardserver.app",
    "cardserver.streams",
    "cardserver.registry",
    "cardserver.sessions",
    "cardserver.identity",
    "cardserver.errors",
    "cardserver.schemas",
    "cardserver.protocol",
]

[[tool.importlinter.contracts]]
name = "Rules are transport-free"
type = "forbidden"
source_modules = ["cardwork", "cardgames"]
forbidden_modules = [
    "cardserver",
    "fastapi",
    "starlette",
    "httpx",
    "asyncio",
    "requests",
]

[[tool.importlinter.contracts]]
name = "The framework knows no game"
type = "forbidden"
source_modules = ["cardwork", "cardserver"]
forbidden_modules = ["cardgames"]

[[tool.importlinter.contracts]]
name = "Rules know no presentation"
type = "layers"
containers = ["cardgames"]
layers = ["frontend", "backend"]

[[tool.importlinter.contracts]]
name = "Passing stands apart"
type = "forbidden"
source_modules = ["cardgames.*.passing"]
forbidden_modules = ["cardgames.*.showdown"]

[[tool.importlinter.contracts]]
name = "Showdown stands apart"
type = "forbidden"
source_modules = ["cardgames.*.showdown"]
forbidden_modules = ["cardgames.*.passing"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["cardwork", "cardserver", "cardgames"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
files = ["src/cardwork", "src/cardserver", "src/cardgames"]
exclude = ["tests"]
disallow_subclassing_any = true
ignore_missing_imports = true
strict = true
enable_error_code = ["deprecated"]
